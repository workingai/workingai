<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working AI - 페이지를 찾을 수 없습니다 (404)</title>
  <link rel="icon" href="favicon.png?v=2" type="image/png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F2F8F5',
              100: '#E6F2ED',
              500: '#2A6B52', // Green
              600: '#1D4E3A', // Darker Green
            },
            neutral: {
              50: '#F8F7F4',
              100: '#F2F1EE',
              200: '#E5E3DF',
              300: '#DDDBD5',
              400: '#B0AEA8',
              500: '#8A8881',
              600: '#605E59',
              900: '#1A1A18',
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Pretendard Font & Global CSS -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="global.css">

  <script>
    // 전역 리다이렉트 및 화면 제어 로직
    (async function checkMigrationRedirect() {
      const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwmedfL4Q8uUhXqKg3xa1yMEfGGUHYjRrRn1wjZN3_n_QcUMqnxmHUi1OMT3oIhZCBtKA/exec";
      const CACHE_KEY = 'wa_redirect_rules';
      const CACHE_TTL = 5 * 60 * 1000; // 5분

      let rules = null;
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const { data, ts } = JSON.parse(cached);
          if (Date.now() - ts < CACHE_TTL) {
            rules = data;
          }
        }
      } catch (e) {}

      const normalizeUrl = (url) => {
        if (!url) return '';
        return url.toLowerCase()
          .replace(/^(https?:\/\/)?(www\.)?/, '')
          .replace(/\/+$/, '');
      };

      const checkRedirect = (rulesList) => {
        const normalizedCurrent = normalizeUrl(window.location.href);
        return rulesList.find(r => {
          const normalizedBefore = normalizeUrl(r.before);
          return normalizedBefore && (normalizedCurrent.includes(normalizedBefore) || normalizedCurrent === normalizedBefore);
        });
      };

      // 1. 캐시된 규칙이 있으면 즉시 비교 후 리다이렉트
      if (rules) {
        const match = checkRedirect(rules);
        if (match && match.redirect) {
          window.location.replace(match.redirect);
          return;
        }
      }

      // 2. 캐시가 없거나 만료된 경우 백그라운드에서 신규 규칙 로드 및 비교
      try {
        const res = await fetch(GAS_API_URL + '?action=getRedirects');
        const json = await res.json();
        const freshRules = json.rules || [];
        localStorage.setItem(CACHE_KEY, JSON.stringify({ data: freshRules, ts: Date.now() }));
        
        const match = checkRedirect(freshRules);
        if (match && match.redirect) {
          window.location.replace(match.redirect);
          return;
        }
      } catch (e) {
        console.warn("리다이렉트 체크 실패:", e);
      }

      // 3. 일치하는 규칙이 없는 진짜 존재하지 않는 경로인 경우 로딩 제거하고 404 콘텐츠 표시
      const renderErrorPage = () => {
        const loadingScreen = document.getElementById('loading-screen');
        const errorContent = document.getElementById('error-content');
        
        if (loadingScreen) loadingScreen.classList.add('hidden');
        if (errorContent) errorContent.classList.remove('hidden');
        
        // 경로 텍스트 설정
        const pathEl = document.getElementById('requested-path');
        if (pathEl) {
          pathEl.textContent = decodeURIComponent(window.location.pathname);
        }

        // www. -> wb. 제안 및 자동 변경 버튼 처리
        const currentHref = window.location.href;
        const autoConvertBtn = document.getElementById('auto-convert-btn');
        const suggestionBox = document.getElementById('suggestion-box');
        
        if (currentHref.includes('//www.')) {
          const newHref = currentHref.replace('//www.', '//wb.');
          if (autoConvertBtn) {
            autoConvertBtn.href = newHref;
            autoConvertBtn.classList.remove('hidden');
          }
        } else {
          // 현재 접속 주소에 www.가 없더라도, 매뉴얼 안내용 제안 박스 상시 노출
          if (suggestionBox) {
            suggestionBox.classList.remove('hidden');
          }
        }
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderErrorPage);
      } else {
        renderErrorPage();
      }
    })();
  </script>
</head>
<body class="bg-neutral-100 min-h-screen flex flex-col font-sans">

  <!-- 1. 리다이렉트 확인용 로딩 화면 (레이아웃 시프트 방지) -->
  <div id="loading-screen" class="fixed inset-0 bg-neutral-100 z-[999] flex flex-col items-center justify-center">
    <div class="animate-spin rounded-full h-10 w-10 border-4 border-brand-500 border-t-transparent mb-4"></div>
    <p class="text-neutral-600 font-bold text-base">페이지를 이동하는 중입니다...</p>
    <p class="text-neutral-400 text-xs mt-1">잠시만 기다려 주세요.</p>
  </div>

  <!-- 상단 네비게이션 바 플레이스홀더 -->
  <div id="navbar-placeholder"></div>

  <!-- 2. 실제 404 에러 콘텐츠 (기본 숨김, 리다이렉트 없을 시 활성화) -->
  <main id="error-content" class="flex-grow flex items-center justify-center px-4 py-16 hidden">
    <div class="max-w-lg w-full bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-neutral-200/60 p-8 md:p-10 text-center relative overflow-hidden">
      
      <!-- 상단 데코레이션 그라디언트 라인 -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-brand-500 to-amber-500"></div>

      <!-- 404 일러스트 아이콘 -->
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-amber-50 text-amber-500 mb-6 animate-pulse">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>

      <!-- 타이틀 -->
      <h1 class="text-2xl md:text-3xl font-extrabold text-neutral-900 mb-3">페이지를 찾을 수 없습니다</h1>
      <p class="text-neutral-500 text-sm md:text-base mb-6">요청하신 주소가 올바르지 않거나 변경되어 접속할 수 없습니다.</p>

      <!-- 찾고 있던 주소 정보 카드 -->
      <div class="bg-neutral-50 rounded-xl p-4 mb-6 border border-neutral-200/50 text-left">
        <span class="text-xs font-bold text-neutral-400 block mb-1">요청한 주소 경로</span>
        <code id="requested-path" class="text-xs md:text-sm font-semibold text-neutral-700 block break-all font-mono"></code>
      </div>

      <!-- 주소 제안 박스 (wb. 변경 안내) -->
      <div id="suggestion-box" class="bg-brand-50/60 border border-brand-100 rounded-xl p-5 mb-8 text-left">
        <h3 class="text-sm font-extrabold text-brand-600 flex items-center gap-1.5 mb-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
          </svg>
          실습 자료 주소 연결 안내
        </h3>
        <p class="text-xs md:text-sm text-neutral-600 leading-relaxed">
          혹시 실습을 위해 찾으시는 주소인가요?<br>
          주소의 <strong class="text-brand-600 font-bold">www.</strong> 부분을 <strong class="text-amber-600 font-bold">wb.</strong>로 변경하시면 바로 연결될 수 있습니다.
        </p>
        <div class="mt-3.5 pt-3 border-t border-neutral-200/60 flex flex-col gap-1 text-[11px] md:text-xs text-neutral-500 font-mono">
          <div class="flex items-center gap-1">
            <span class="text-red-500">이전:</span> <span class="line-through">https://www.workingai.co.kr/...</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="text-brand-600 font-bold">변경:</span> <span class="font-bold text-neutral-800">https://wb.workingai.co.kr/...</span>
          </div>
        </div>
      </div>

      <!-- 액션 버튼 영역 -->
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <!-- 자동으로 wb.로 전환해서 연결되는 버튼 (현재 주소에 www.가 있을 경우 활성화) -->
        <a id="auto-convert-btn" href="#" class="hidden inline-flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 text-white font-extrabold px-6 py-3 rounded-xl transition-all shadow-md shadow-amber-500/10 hover:shadow-lg hover:shadow-amber-500/20 text-sm">
          <span>wb. 주소로 자동 전환하여 이동</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
          </svg>
        </a>
        
        <a href="/" class="inline-flex items-center justify-center bg-brand-500 hover:bg-brand-600 text-white font-extrabold px-6 py-3 rounded-xl transition-all shadow-md shadow-brand-500/10 hover:shadow-lg hover:shadow-brand-500/20 text-sm">
          메인 페이지로 이동
        </a>
      </div>
    </div>
  </main>

  <!-- 공통 네비게이션 스크립트 로드 -->
  <script src="navbar_v12.js"></script>
</body>
</html>
